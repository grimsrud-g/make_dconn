[project]
name = "make-dconn"
version = "0.1.0"
description = "Build motion-censored, smoothed dense connectomes (dconn) from XCP-D CIFTI outputs with Connectome Workbench"
authors = [{ name = "Grimsrud", email = "grimsrud@stanford.edu" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Exact pins: versions already in the group uv cache (do not bump them).
# Newer numpy/scipy also lack wheels for Sherlock's glibc 2.17.
dependencies = [
    "numpy==2.2.6",
    "nibabel==5.4.2",
    "pyyaml==6.0.3",
]

[project.scripts]
make-dconn = "make_dconn.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/make_dconn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
# Keep transitive dev dependencies at the versions already in the uv cache.
constraint-dependencies = ["pluggy==1.6.0", "iniconfig==2.3.0"]
